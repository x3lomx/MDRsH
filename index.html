<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>منصة أبطال العلوم</title>
    <style>
        :root {
            --primary: #00c9ff;
            --accent: #00ffff;
            --bg-image: url('https://i.postimg.cc/j5SxZ6NM/ns-fqrtk-(1).png');
        }

        body {
            margin: 0;
            font-family: 'Tahoma', sans-serif;
            color: white;
            text-align: center;
            background: #0f2027;
            overflow-x: hidden;
        }

        .animated-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            z-index: -1;
            animation: backgroundMove 30s linear infinite alternate;
        }

        @keyframes backgroundMove {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        .overlay {
            background: rgba(0, 0, 0, 0.75);
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 { animation: glow 2s infinite alternate; margin-top: 10px; font-size: 2.2rem; }
        @keyframes glow { from { text-shadow:0 0 10px var(--accent); } to { text-shadow:0 0 25px #00ffcc; } }

        .card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 25px;
            margin: 20px auto;
            max-width: 800px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .grade-btn {
            padding: 15px 30px; margin: 10px; border: none; border-radius: 12px;
            background: linear-gradient(45deg, #00c9ff, #92fe9d);
            color: #002b36; font-weight: bold; font-size: 1.1rem;
            cursor: pointer; transition: 0.4s;
        }

        .grade-btn:hover { transform: scale(1.05) translateY(-3px); box-shadow: 0 0 15px var(--accent); }

        select, input[type="text"] {
            padding: 12px; border-radius: 8px; border: none; margin: 10px;
            width: 85%; max-width: 350px; font-size: 1rem;
        }

        .q-card { text-align: right; line-height: 1.6; }
        .hidden { display: none; }
        img { max-width: 100%; border-radius: 10px; margin: 15px 0; }
        
        .footer-info { font-size: 0.9rem; opacity: 0.8; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="animated-bg"></div>
    
    <div class="overlay">
        <h1>🚀 منصة أبطال العلوم</h1>
        <p>مدرسة ذات الصواري المتوسطة وعبدالله بن ابي السرح الإبتدائية</p>
        <p class="footer-info">مدير المدرسة: أ. سهيل عقيلي | معلم المادة: ريان الأسمري</p>

        <hr style="border: 0.5px solid rgba(255,255,255,0.1); width: 60%; margin: 20px auto;">

        <div id="mainContent">
            <div id="setupDiv" class="card">
                <h3>أهلاً بك يا بطل، اختر صفك الدراسي للبدء:</h3>
                <button class="grade-btn" onclick="fetchCSV('رابع')">الرابع الابتدائي</button>
                <button class="grade-btn" onclick="fetchCSV('سادس')">السادس الابتدائي</button>
                <button class="grade-btn" onclick="fetchCSV('أول متوسط')">أول متوسط</button>
                <button class="grade-btn" onclick="fetchCSV('ثاني متوسط')">ثاني متوسط</button>
                <button class="grade-btn" onclick="fetchCSV('ثالث متوسط')">ثالث متوسط</button>
            </div>

            <div id="loginDiv" class="card hidden">
                <h4>اختر اسمك من القائمة:</h4>
                <select id="studentSelect"></select><br>
                <button class="grade-btn" onclick="showTabs()">دخول للمنصة</button>
            </div>

            <div id="tabsDiv" class="card hidden"></div>

            <div id="questionsDiv" class="hidden"></div>
        </div>
    </div>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRyf30iF-FRfr7-gIEWnsMoXbmPdTRlYQx4ydftPkpM-RHftF3JInXoa1CbnHZXw4RJ5AFnuQM6JBNI/pub?output=csv";
        
        let allData = [];
        let studentName = "";
        let selectedGrade = "";

        async function fetchCSV(grade) {
            selectedGrade = grade;
            const setupDiv = document.getElementById("setupDiv");
            setupDiv.innerHTML = "<h4>جاري الاتصال بالسحابة...</h4>";
            
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error("لم ينجح الاتصال بالرابط");
                
                const csvText = await response.text();
                allData = parseCSV(csvText);
                
                // فلترة الطلاب: نبحث عن الصف في أي عمود والاسم يكون في أول عمود
                const students = allData.filter(row => row.includes(grade)).map(row => row[0]);

                if (students.length === 0) {
                    alert("عذراً، لم يتم العثور على أسماء لهذا الصف في ملف الإكسل. تأكد من مطابقة اسم الصف تماماً.");
                    location.reload();
                    return;
                }
                
                const sel = document.getElementById("studentSelect");
                sel.innerHTML = students.map(s => `<option>${s}</option>`).join("");
                
                setupDiv.classList.add("hidden");
                document.getElementById("loginDiv").classList.remove("hidden");
            } catch (e) {
                console.error(e);
                alert("فشل جلب البيانات. تأكد من:\n1. أن الملف 'منشور للويب' بصيغة CSV.\n2. أن الرابط في الكود صحيح.");
                location.reload();
            }
        }

        function parseCSV(text) {
            return text.split('\n')
                       .filter(row => row.trim() !== '')
                       .map(row => row.split(',').map(cell => cell.trim().replace(/^"|"$/g, '')));
        }

        function showTabs() {
            studentName = document.getElementById("studentSelect").value;
            document.getElementById("loginDiv").classList.add("hidden");
            const tabsDiv = document.getElementById("tabsDiv");
            tabsDiv.classList.remove("hidden");

            // جلب الوحدات/التبويبات لهذا الصف (نفترض العمود 2 هو التبويب)
            const tabs = [...new Set(allData.filter(r => r[0] === selectedGrade).map(r => r[1]))];
            
            let html = `<h3>أهلاً بك يا ${studentName}</h3><p>اختر الوحدة الدراسية:</p>`;
            tabs.forEach(t => {
                if(t && t !== "التبويب") html += `<button class="grade-btn" onclick="loadQuestions('${t}')">${t}</button>`;
            });
            tabsDiv.innerHTML = html;
        }

        function loadQuestions(tabName) {
            document.getElementById("tabsDiv").classList.add("hidden");
            const qDiv = document.getElementById("questionsDiv");
            qDiv.classList.remove("hidden");

            const questions = allData.filter(r => r[0] === selectedGrade && r[1] === tabName);
            
            let html = `<div class="card"><h2>وحدة: ${tabName}</h2></div>`;
            questions.forEach((q, i) => {
                html += `
                    <div class="card q-card">
                        <p><strong>س${i+1}:</strong> ${q[2]}</p>
                        ${q[6] ? `<img src="${q[6]}">` : ''}
                        <div>${renderOptions(q, i)}</div>
                    </div>`;
            });
            html += `<button class="grade-btn" style="background:#f39c12; width:85%" onclick="finishQuiz()">إرسال الإجابات ✅</button>`;
            qDiv.innerHTML = html;
        }

        function renderOptions(q, i) {
            if (q[3] === "اختيار") {
                return q[4].split("|").map(o => `<div style="margin:5px 0;"><input type="radio" name="q${i}" value="${o}"> ${o}</div>`).join("");
            } else if (q[3] === "صح وخطأ") {
                return `<div><input type="radio" name="q${i}" value="صح"> صح</div><div><input type="radio" name="q${i}" value="خطأ"> خطأ</div>`;
            } else {
                return `<input type="text" placeholder="اكتب إجابتك هنا...">`;
            }
        }

        function finishQuiz() {
            alert(`تم استلام إجاباتك يا ${studentName}.. بارك الله فيك!`);
            location.reload();
        }
    </script>
</body>
</html>
